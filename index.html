<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>English Master</title>
<style>
body{margin:0;font-family:Arial;background:#101828;color:white}
header{padding:25px;text-align:center;background:#172554}
h1{margin:0;font-size:28px}
p{color:#cbd5e1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}
button{border:0;border-radius:15px;padding:20px 8px;font-size:16px;font-weight:bold;background:#2563eb;color:white}
.card{margin:18px;padding:20px;background:#1e293b;border-radius:18px}
.level{background:#0f766e}
</style>
</head>
<body>

<header>
<h1>🇬🇧 English Master</h1>
<p>A2 → C1 English Learning</p>
</header>

<div class="card">
<h2>📈 Choose your level</h2>
<div class="grid">
<button class="level">A2</button>
<button class="level">B1</button>
<button class="level">B2</button>
<button class="level">C1</button>
</div>
</div>

<div class="grid">
<button>📚 Vocabulary</button>
<button>🧠 Grammar</button>
<button>🎧 Listening</button>
<button>📖 Reading</button>
<button>🗣 Speaking</button>
<button>✍️ Writing</button>
<button>🎯 IELTS</button>
<button>🏅 CEFR</button>
<button>🔤 Pronunciation</button>
<button>💬 Conversation</button>
<button>🧩 Phrasal Verbs</button>
<button>💡 Idioms</button>
<button>📝 Quiz</button>
<button>📊 My Progress</button>
</div>

<div class="card">
<h2>🔥 Daily Challenge</h2>
<p>Learn English every day and improve from A2 to C1.</p>
<button>Start Challenge 🚀</button>
</div>

</body>
  </html>
